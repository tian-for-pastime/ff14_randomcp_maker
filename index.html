<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>세븐틴 랜덤씨피 생성기</title>
    <style>
      :root{--bg:#fff;--fg:#222;--line:#ccc;--accent:#2563eb;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
      @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181818;--fg:#eee;--line:#444;--accent:#3b82f6}}
      :root[data-theme="dark"]{--bg:#181818;--fg:#eee;--line:#444;--accent:#3b82f6}
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Malgun Gothic",sans-serif}
      .wrap{max-width:420px;margin:0 auto;padding:20px 16px}
      h1{text-align:center;font-size:20px;margin:0 0 20px;padding-bottom:8px;border-bottom:1px solid var(--line)}
      #btn{display:block;width:100%;padding:16px;font-size:20px;font-weight:bold;border:0;border-radius:999px;background:var(--accent);color:var(--on)}
      #btn:active{opacity:.8}
      #result{margin:20px 0 12px;height:120px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:bold;border:2px solid var(--line);border-radius:8px}
      .opts{display:flex;justify-content:space-between;margin-bottom:24px}
      .opts label{display:flex;align-items:center;gap:6px;font-size:14px}
      h2{font-size:16px;margin:0 0 8px}
      #history{margin:0;padding:0 0 0 24px;max-height:160px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding-top:8px;padding-bottom:8px;padding-right:12px}
      #history:empty::before{content:"기록 없음";color:var(--line)}
    </style>
  </head>
  <body>
  <div class="wrap">
    <h1>세븐틴 랜덤씨피 생성기</h1>
    <button id="btn" type="button">셔플!</button>
    <div id="result">-</div>
    <div class="opts">
      <label><input type="checkbox" id="opt2"> 자공자수 제외 </label>
      <label><input type="checkbox" id="opt3"> 왼 고정 </label>
      <label><input type="checkbox" id="opt4"> 른 고정 </label>
    </div>
    <ol id="history"></ol>
  </div>
  <script>
  var left = 0; var right = 0;
  var used = new Set([]);
  var data = {
    1: "쿱스",
    2: "정한",
    3: "슈아",
    4: "준",
    5: "호시",
    6: "원우",
    7: "우지",
    8: "명호",
    9: "민규",
    10: "도겸",
    11: "승관",
    12: "한솔",
    13: "디노"
  }

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  document.getElementById('btn').addEventListener('click', function () {
    let noEq = document.getElementById('opt2').checked;
    let fixLeft = document.getElementById('opt3').checked;
    let fixRight = document.getElementById('opt4').checked;

    if (fixLeft && fixRight) {
      return;
    }

    let suffleAgainFlag = false;
    let shuffleCount = 0;
    let key = "";

    do {
      if (!fixLeft || left == 0) {
        left = getRandomInt(1, 13);
      }
      if (!fixRight || right == 0) {
        right = getRandomInt(1, 13);
      }

      key = left + "," + right;

      if (noEq && left == right) {
        suffleAgainFlag = true;
      } else if (used.has(key)) {
        suffleAgainFlag = true;
      } else {
        suffleAgainFlag = false;
      }
      shuffleCount++;
    } while (suffleAgainFlag && shuffleCount < 100);

    if (shuffleCount >= 100) {
        return;
    }

    used.add(key);

    resultString = data[left] + " * " + data[right];
    document.getElementById('result').textContent = resultString;

    var li = document.createElement('li');
    li.textContent = resultString;
    var h = document.getElementById('history');

    h.insertBefore(li, h.firstChild);
    
  });
  </script>
  </body>
</html>
